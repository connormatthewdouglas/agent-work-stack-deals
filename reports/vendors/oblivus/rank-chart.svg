  <text x="160" y="176" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#111">RTX 4090</text>
  <rect x="168" y="160" width="96.5" height="16" fill="#f59e0b" rx="2"/>
  <text x="268.5" y="173" font-family="system-ui,sans-serif" font-size="10" fill="#111">$0.64</text>
  <rect x="168" y="178" width="51.3" height="16" fill="#64748b" rx="2"/>
