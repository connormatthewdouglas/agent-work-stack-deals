<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 204" role="img" aria-label="Current hourly rate versus the cheapest tracked vendor, by GPU model.">
  <title>CloudRift hourly rate vs cheapest tracked comparable rate</title>
  <rect width="720" height="204" fill="#fafafa"/>
  <text x="168" y="20" font-family="system-ui,sans-serif" font-size="13" fill="#111">CloudRift (amber) vs cheapest tracked comparable rate (gray)</text>
  <text x="160" y="60" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#111">L40S</text>
  <rect x="168" y="44" width="451.5" height="16" fill="#f59e0b" rx="2"/>
  <text x="623.5" y="57" font-family="system-ui,sans-serif" font-size="10" fill="#111">$0.59</text>
  <rect x="168" y="62" width="528.0" height="16" fill="#64748b" rx="2"/>
  <text x="700.0" y="75" font-family="system-ui,sans-serif" font-size="10" fill="#333">$0.69 (CloudRift)</text>
  <text x="160" y="118" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#111">RTX 5090</text>
  <rect x="168" y="102" width="420.9" height="16" fill="#f59e0b" rx="2"/>
  <text x="592.9" y="115" font-family="system-ui,sans-serif" font-size="10" fill="#111">$0.55</text>
  <rect x="168" y="120" width="497.4" height="16" fill="#64748b" rx="2"/>
  <text x="669.4" y="133" font-family="system-ui,sans-serif" font-size="10" fill="#333">$0.65 (CloudRift)</text>
</svg>
