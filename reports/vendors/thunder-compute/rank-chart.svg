<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Current hourly rate versus the cheapest tracked vendor, by GPU model.">
  <title>Thunder Compute hourly rate vs cheapest tracked comparable rate</title>
  <rect width="720" height="320" fill="#fafafa"/>
