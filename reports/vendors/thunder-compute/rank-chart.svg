  <text x="351.9" y="115" font-family="system-ui,sans-serif" font-size="10" fill="#111">$1.09</text>
  <rect x="168" y="120" width="146.9" height="16" fill="#64748b" rx="2"/>
  <text x="318.9" y="133" font-family="system-ui,sans-serif" font-size="10" fill="#333">$0.89 (Jarvislabs)</text>
  <text x="160" y="176" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#111">RTX A6000</text>
  <rect x="168" y="160" width="57.8" height="16" fill="#f59e0b" rx="2"/>
