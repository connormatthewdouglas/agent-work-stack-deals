  <text x="160" y="60" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#111">L40</text>
  <rect x="168" y="44" width="130.4" height="16" fill="#f59e0b" rx="2"/>
  <text x="302.4" y="57" font-family="system-ui,sans-serif" font-size="10" fill="#111">$0.79</text>
