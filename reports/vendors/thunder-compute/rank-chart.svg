  <text x="302.4" y="75" font-family="system-ui,sans-serif" font-size="10" fill="#333">$0.79 (Thunder Compute)</text>
  <text x="160" y="118" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#111">A100</text>
