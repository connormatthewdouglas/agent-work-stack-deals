  <text x="160" y="234" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#111">H100 SXM</text>
  <rect x="168" y="218" width="528.0" height="16" fill="#f59e0b" rx="2"/>
  <text x="700.0" y="231" font-family="system-ui,sans-serif" font-size="10" fill="#111">$3.2</text>
  <rect x="168" y="236" width="412.5" height="16" fill="#64748b" rx="2"/>
