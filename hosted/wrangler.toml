# Free-plan Python Worker. No paid features. Deploy: ./build.sh && npx wrangler deploy
name = "lantern-works-mcp"
main = "src/entry.py"
compatibility_date = "2025-09-01"
compatibility_flags = ["python_workers"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "lantern-works-hosted-mcp-stats"
database_id = "67b5b2c6-7b12-4008-a977-a2636d007a8a"

# Price watches (hosted only): own D1 database, separate from the anonymous stats DB above.
# Create once: npx wrangler d1 create lantern-works-hosted-watches  -> paste its id below (placeholder until then)
#              npx wrangler d1 execute lantern-works-hosted-watches --remote --file=watch_schema.sql
[[d1_databases]]
binding = "WATCH_DB"
database_name = "lantern-works-hosted-watches"
database_id = "00000000-0000-0000-0000-000000000000"

# Price watches: daily alert run after the ~10:23 UTC refresh + one retry run. Free plan: cron
# triggers are included (up to 5 per account). Secret (not in git): npx wrangler secret put WATCH_SIGNING_MASTER
[triggers]
crons = ["50 10 * * *", "50 16 * * *"]
