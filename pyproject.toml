[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lantern-works-deals-mcp"
version = "0.3.42"
description = "Read-only MCP server (stdio): GPU rental price comparison checked daily (H100, H200, A100, L40S, RTX 4090/5090 and more) with price history, a stack cost optimizer, and AI-infra deals and free tiers."
readme = "mcp_server/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [{ name = "Lantern Works" }]
dependencies = ["mcp>=1.19,<2"]
keywords = ["mcp", "model-context-protocol", "deals", "ai-agents"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://thelanternworks.com/for-agents/"
Repository = "https://github.com/connormatthewdouglas/agent-work-stack-deals"

[project.scripts]
lantern-works-deals-mcp = "lantern_works_deals_mcp.server:main"

[tool.setuptools]
packages = ["lantern_works_deals_mcp", "lantern_works_deals_mcp.core"]

[tool.setuptools.package-data]
"lantern_works_deals_mcp.core" = ["assets/*.json"]

[tool.setuptools.package-dir]
lantern_works_deals_mcp = "mcp_server"
"lantern_works_deals_mcp.core" = "core"

[tool.pytest.ini_options]
testpaths = ["tests"]
