name: Deploy hosted MCP

# A3: publish the Cloudflare Worker on each GitHub release and version tag.
# Replaces a manual `wrangler deploy`. Pushes made with GITHUB_TOKEN do not need a PAT.
# Required repository secrets (Cloudflare API token with Workers Scripts edit on this account):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-mcp-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Manual runs only from main. Releases and v* tags still deploy from the ref that was published.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN. Create a Cloudflare API token with Workers Scripts:Edit for the lantern-works account and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID. Set it to the Cloudflare account id that owns the lantern-works-mcp Worker."
            exit 1
          fi
          sh hosted/deploy.sh
