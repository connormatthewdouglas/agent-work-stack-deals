name: Validate feed and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"   # daily link + gist-parity check (does not deploy)

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema[format]==4.*"
      - name: Generator runs cleanly (guard + public-output leak scan, no private file in CI)
        run: |
          python3 scripts/generate_seo_pages.py
          # deals.json, api/v1 and sitemap must match what is committed (HTML may differ by freshness date)
          git diff --exit-code -- deals.json api/v1/deals.json sitemap.xml schema.json
      - name: Internal link check (generated site + READMEs/SKILL.md; fails on missing targets)
        run: python3 scripts/check_internal_links.py
      - name: Schema, private-field leak, api/v1 parity, sitemap, old-host hardcode checks
        run: python3 scripts/validate_feed.py
      - name: Gist mirror parity
        run: python3 scripts/validate_feed.py --gist
      - name: Redeem URL link check (advisory; flaky vendors such as softshellweb 5xx never fail the job)
        continue-on-error: true
        run: python3 scripts/validate_feed.py --links

  tests:
    # ALL tests (tests/ = core, MCP server, GPU) + SKILL.md + packaging (offline: LANTERN_DEALS_FILE points at the committed feed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r mcp_server/requirements.txt pytest pyyaml "jsonschema[format]==4.*"
      - name: GPU rate changes carry source_url + quote + checked_at (vs previous commit and latest snapshot)
        env:
          BEFORE: ${{ github.event.before }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BASE_PR:-$BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=HEAD~1; fi
          python3 scripts/check_gpu_changes.py --base "$base"
      - name: pytest (entire tests/ directory incl. test_gpu.py)
        env:
          LANTERN_DEALS_FILE: api/v1/deals.json
        run: python3 -m pytest -q tests
      - name: Telemetry collector tests (Worker validation, aggregation, rate limit)
        run: node --test collector/test/collector.test.js
      - name: SKILL.md frontmatter parses; repo /SKILL.md copy matches source
        run: python3 scripts/check_skill.py
      - name: Feed validator
        run: python3 scripts/validate_feed.py
      - name: Package builds and installs
        run: |
          pip install build
          python3 -m build
          pip install dist/*.whl
          python3 -c "import lantern_works_deals_mcp.server"

  pypi-install:
    # Clean-environment install of the PUBLISHED package from PyPI (fresh venv + uvx), all 3 tools over stdio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: PyPI clean install + stdio tool calls (latest release; 0.2.0+ must expose and pass compare_gpu_prices)
        run: python3 scripts/test_pypi_install.py --uvx

  docker:
    # Glama-style container run: build the Dockerfile (installs the pinned PyPI release) and call every tool over stdio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker build -t lantern-works-deals-mcp .
      - name: Docker stdio tool calls
        run: |
          ver=$(sed -n 's/.*lantern-works-deals-mcp==\([0-9.]*\).*/\1/p' Dockerfile)
          python3 scripts/test_pypi_install.py --version "$ver" --docker lantern-works-deals-mcp

  release-gate:
    # T41 pricing-decision release gate (Gauge): 20 agent questions checked against the BUILT feed/site in this
    # checkout (api/v1/*.json, index.html), i.e. what is about to ship, not the live site. Any failing case fails
    # the job, and deploy needs it. Own install pins mcp<2 (mcp 2.x removed FastMCP).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mcp>=1.10,<2"
      - name: Build the feed/site the same way validate does
        run: python3 scripts/generate_seo_pages.py
      - name: T41 release gate (local build; exits 1 on any failing case)
        run: python3 tests/release_gate/run_t41.py --source local t41-results.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t41-results
          path: t41-results.json
          if-no-files-found: ignore

  live-checks:
    # LIVE-site checks (URL migration/key paths/gist==live feed, /SKILL.md frontmatter). These test the deployed
    # site, so they run after deploy (or on schedule), never as a pre-deploy gate (live always lags a new commit).
    needs: [deploy]
    if: always() && (needs.deploy.result == 'success' || github.event_name == 'schedule')
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - run: sleep 60   # let the Pages CDN pick up the new deployment
        if: needs.deploy.result == 'success'
      - run: python3 scripts/check_skill.py --live
      - run: python3 scripts/test_url_migration.py
      - name: GPU refresh freshness (warn if no snapshot today / > 24 h; fail if last refresh > 26 h)
        run: python3 scripts/check_gpu_freshness.py
      - name: GPU pricing sources (daily via schedule; stale > 7 days, unreachable, or quoted price missing => fail). Never edits prices.
        id: gpusrc
        run: python3 scripts/check_gpu_sources.py --report gpu-sources-report.md
      - name: Open or update a GitHub issue for flagged GPU pricing records
        if: failure() && steps.gpusrc.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="GPU pricing check: records need a manual re-check"
          gh label create gpu-pricing-check --color D93F0B --description "Daily GPU pricing source check" 2>/dev/null || true
          n=$(gh issue list --label gpu-pricing-check --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file gpu-sources-report.md
          else
            gh issue create --title "$title" --label gpu-pricing-check --body-file gpu-sources-report.md
          fi

  deploy:
    # Deploy is gated on validation. Only from main pushes / manual runs.
    needs: [validate, tests, pypi-install, docker, release-gate]
    # Pages source = "GitHub Actions" (build_type=workflow) with repo variable PAGES_DEPLOY_VIA_ACTIONS=true,
    # so nothing reaches the live site unless validate + tests + pypi-install pass. Rollback: set Pages
    # build_type back to legacy (branch main, /) and the variable to false.
    if: vars.PAGES_DEPLOY_VIA_ACTIONS == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Same Jekyll build GitHub's branch deploy used, so URLs are unchanged. CNAME is copied into _site.
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4

  expiry-alert:
    # Gauge re18 R2: a failed run (any gate, deploy or live check) while the LIVE stock claims expire within 2 h
    # opens (or comments on) one GitHub issue, so a broken deploy never silently leaves expiring claims up.
    needs: [validate, tests, pypi-install, docker, release-gate, deploy, live-checks]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check live claim expiry, alert if within 2 h
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          msg=$(python3 - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone, timedelta
          d = json.load(urllib.request.urlopen("https://thelanternworks.com/api/v1/gpu-prices.json", timeout=30))
          now = datetime.now(timezone.utc)
          exp = sorted(datetime.fromisoformat(a["availability_expires_at"].replace("Z", "+00:00"))
                       for a in ((r.get("availability") or {}) for r in d.get("rates", []))
                       if a.get("in_stock") is not None and a.get("availability_expires_at"))
          if exp and exp[0] - now <= timedelta(hours=2):
              print(f"{len(exp)} live stock claims; earliest expiry {exp[0].isoformat().replace('+00:00', 'Z')} "
                    f"({(exp[0] - now).total_seconds() / 3600:.1f} h from now)")
          PY
          )
          [ -n "$msg" ] || { echo "No live claim expires within 2 h; no alert."; exit 0; }
          title="Deploy failed while stock claims are about to expire"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number -q '.[0].number // empty')
          body="Run $RUN_URL failed. $msg. Fix the run (or re-run it) so the pages rebuild before expiry."
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$body"; else gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
