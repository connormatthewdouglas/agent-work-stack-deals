name: Verda daily re-cite

# Re-read only Verda's verda.com/pricing rows (official refresh()+Fetcher(), robots.txt
# honoured), then generate_seo_pages.py, and push a fresh dated branch from current
# origin/main when prices move (or a new #265 stale hold is applied). Does not merge
# an existing daily branch (run 44595048039 conflicted after later collector commits
# regenerated the same HTML on main). Does not open a pull request, does not change
# the live-check, does not push to main, does not force-push, and does not auto-merge.
# This job does not need pull-requests: write (the repo setting that blocks Actions
# from opening PRs is left as-is).
#
# After a successful push this job dispatches validate-and-deploy.yml on that branch
# (workflow_dispatch is allowed with GITHUB_TOKEN; that run does not deploy — deploy
# is main-only) and writes a step summary with the branch, a compare link, and the
# moved rows so a PR can be opened by hand. Recite itself writes only verda.json;
# generated pages are the pinned generator's output from that recitation.
on:
  schedule:
    - cron: "30 10 * * *"    # 10:30 UTC (5:30 AM ET on standard time, 6:30 AM ET on daylight time); before live-checks at 17 11 * * * UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # only to dispatch validate-and-deploy on the daily branch; still the repo GITHUB_TOKEN

concurrency:
  group: verda-daily-recite
  cancel-in-progress: false

jobs:
  recite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      LANTERN_DEALS_FILE: api/v1/deals.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: pip install -r mcp_server/requirements.txt pytest pyyaml "jsonschema[format]==4.*"

      - name: Prepare a fresh dated branch from current origin/main (no push yet)
        id: prep
        run: |
          set -euo pipefail
          git fetch -q origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Fresh from current main every run. Never merge an older daily branch
          # (that is what conflicted in 44595048039 once later collector commits
          # regenerated the same HTML). Same-day reruns get a -2, -3, ... suffix;
          # no force-push.
          date=$(date -u +%Y%m%d)
          base="scout/verda-daily-recite-$date"
          branch=$base
          n=2
          while git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; do
            branch="${base}-${n}"
            n=$((n + 1))
          done
          git checkout -B "$branch" origin/main
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Using branch $branch from origin/main"

      - name: Official Verda pricing-page re-cite
        id: recite
        run: |
          set -euo pipefail
          python3 scripts/recite_verda_prices.py --report "$RUNNER_TEMP/recite.json"
          python3 -c "
          import json, os
          from pathlib import Path
          d = json.loads(Path(os.environ['RUNNER_TEMP'], 'recite.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('should_write=%s\n' % ('true' if d.get('should_write') else 'false'))
              f.write('stamp=%s\n' % (d.get('stamp') or ''))
          keys = ('should_write', 'prices_moved', 'new_holds', 'stamp')
          print(json.dumps({k: d.get(k) for k in keys}, indent=2))
          "

      - name: Nothing moved — exit clean with no branch update
        if: steps.recite.outputs.should_write != 'true'
        run: |
          echo "No Verda pricing-page move or new stale hold. Branch not updated." >> "$GITHUB_STEP_SUMMARY"
          echo "This job does not open a pull request and does not need pull-requests: write." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate site/API with the recitation clock
        if: steps.recite.outputs.should_write == 'true'
        env:
          LW_AVAIL_NOW: ${{ steps.recite.outputs.stamp }}
        run: python3 scripts/generate_seo_pages.py

      - name: Test suite (in-job; validate-and-deploy is also dispatched on the branch)
        if: steps.recite.outputs.should_write == 'true'
        env:
          LW_AVAIL_NOW: ${{ steps.recite.outputs.stamp }}
        run: |
          set -euo pipefail
          python3 -m pytest -q tests --tb=line | tee "$RUNNER_TEMP/pytest.txt"
          python3 tests/release_gate/run_t41.py --source local "$RUNNER_TEMP/t41.json" | tee "$RUNNER_TEMP/t41.txt"

      - name: Commit, push the daily branch, dispatch validate-and-deploy, and write the notice
        if: steps.recite.outputs.should_write == 'true'
        env:
          BRANCH: ${{ steps.prep.outputs.branch }}
          STAMP: ${{ steps.recite.outputs.stamp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMPARE_URL: ${{ github.server_url }}/${{ github.repository }}/compare/main...${{ steps.prep.outputs.branch }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Refresh reported a write, but the tree is clean. Branch not updated."
            echo "This job does not open a pull request and does not need pull-requests: write." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add -A
          git commit -m "data: daily Verda pricing re-cite $(date -u +%F)"
          # Branch name was chosen because it did not exist on origin; regular push only.
          git push -u origin "$BRANCH"

          python3 -c "
          import json, os
          from pathlib import Path
          d = json.loads(Path(os.environ['RUNNER_TEMP'], 'recite.json').read_text())
          compare = os.environ.get('COMPARE_URL', '')
          branch = os.environ.get('BRANCH', '')
          lines = []
          lines.append('This job does not open a pull request and does not need pull-requests: write.')
          lines.append('')
          lines.append('Branch: \`' + branch + '\`')
          lines.append('Compare: ' + compare)
          lines.append('')
          lines.append('Job run: ' + os.environ.get('RUN_URL', ''))
          lines.append('Clock: LW_AVAIL_NOW=' + os.environ.get('STAMP', ''))
          lines.append('Dispatched validate-and-deploy.yml on \`' + branch + '\` (deploy is main-only).')
          lines.append('')
          lines.append('## Moved rows')
          lines.append('prices_moved: %s  new_holds: %s' % (d.get('prices_moved'), d.get('new_holds')))
          lines.append('')
          for r in d.get('changed') or []:
              lines.append('- changed %s (%s): %s -> %s' % (r.get('gpu'), r.get('tier'), r.get('old'), r.get('new')))
          for r in d.get('unreadable') or []:
              lines.append('- unreadable %s (%s): %s (old price kept; no value invented)' % (r.get('gpu'), r.get('tier'), r.get('result')))
          if not (d.get('changed') or d.get('unreadable')):
              lines.append('- (no changed or unreadable rows in the recite report)')
          lines.append('')
          lines.append('## In-job tests')
          lines.append('pytest:')
          lines.append(chr(96) * 3)
          pytest_log = Path(os.environ['RUNNER_TEMP'], 'pytest.txt')
          if pytest_log.exists():
              lines.extend(pytest_log.read_text(errors='replace').splitlines()[-20:])
          lines.append(chr(96) * 3)
          lines.append('T41:')
          lines.append(chr(96) * 3)
          t41 = Path(os.environ['RUNNER_TEMP'], 't41.txt')
          if t41.exists():
              lines.extend(t41.read_text(errors='replace').splitlines()[-30:])
          lines.append(chr(96) * 3)
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines) + '\n')
          "

          gh workflow run validate-and-deploy.yml --ref "$BRANCH"
