name: Lium collector

# Also rebuilds data/gpu_availability/rate_7d.json (T112) from the git history of Scout imports.

# T62: collects Lium's public, keyless nodes feed (scripts/collect_lium.py) into data/gpu_pricing/lium.json,
# rebuilds pages and feeds, runs the full test suite, commits only on success, then dispatches the gated deploy.
# Every 2 hours (spec suggests 15-30 min; 2 h keeps commit noise down while prices are sticky). A fetch failure or a
# snapshot older than 60 min keeps the current data; rows auto-hold after 7 days without a capture.
on:
  schedule:
    - cron: "40 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: lium-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r mcp_server/requirements.txt pytest pyyaml "jsonschema[format]==4.*"
      - name: Collect, rebuild, test, commit, push (rebase-retry), dispatch deploy
        env:
          GH_TOKEN: ${{ github.token }}
          LANTERN_DEALS_FILE: api/v1/deals.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          S="$GITHUB_STEP_SUMMARY"
          build() {
            python3 scripts/collect_lium.py >> "$S" 2>&1 || { echo "collector refused; current data kept" >> "$S"; git checkout -q -- data/gpu_pricing; return 1; }
            python3 scripts/availability_rate_7d.py >> "$S" 2>&1 || return 3  # T112: 7-day in-stock share from Scout import history
            python3 scripts/sync_today_snapshot.py >> "$S" 2>&1 || return 3
            python3 scripts/generate_seo_pages.py > /dev/null || return 3
            python3 scripts/gpu_index.py . api/v1 > /dev/null || return 3
            python3 scripts/generate_seo_pages.py > /dev/null || return 3
            git diff --quiet -- deals.json api/v1/deals.json || { echo "::warning::deals.json changed; not publishing"; return 3; }
            [ -n "$(git status --porcelain)" ] || return 1
            python3 scripts/validate_feed.py > /dev/null || return 3
            python3 -m pytest -q tests || return 3
          }
          rc=0; build || rc=$?
          [ "$rc" = 0 ] || { [ "$rc" = 1 ] && exit 0; exit 1; }
          for i in 1 2 3 4; do
            git add -A
            git commit -qm "data: Lium collector $(python3 -c 'import json;print(json.load(open("data/gpu_pricing/lium.json"))["checked_at"])')"
            python3 scripts/gpu_index.py . api/v1 > /dev/null && python3 scripts/generate_seo_pages.py > /dev/null
            if [ -n "$(git status --porcelain)" ]; then git add -A && git commit -qm "data: pin GPU index to the feed commit"; fi
            if sh scripts/rebase_push_main.sh; then pushed=1; break; fi
            echo "push rejected; resetting to origin/main and re-collecting (attempt $i)"
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            sleep $((i * 15))
            rc=0; build || rc=$?
            [ "$rc" = 0 ] || { [ "$rc" = 1 ] && exit 0; exit 1; }
          done
          [ "${pushed:-0}" = 1 ] || { echo "push failed after retries"; exit 1; }
          gh workflow run validate-and-deploy.yml --ref main
