name: Lium collector

# Also rebuilds data/gpu_availability/rate_7d.json (T112) from the git history of Scout imports.

# T62: collects Lium's public, keyless nodes feed (scripts/collect_lium.py) into data/gpu_pricing/lium.json,
# rebuilds pages and feeds, runs the full test suite, commits only on success, then dispatches the gated deploy.
# Every 2 hours (spec suggests 15-30 min; 2 h keeps commit noise down while prices are sticky). A fetch failure or a
# snapshot older than 60 min keeps the current data; rows auto-hold after 7 days without a capture.
on:
  schedule:
    - cron: "40 */2 * * *"
    - cron: "10 1-23/2 * * *"  # fallback: GitHub dropped most scheduled runs since Nov 17; same concurrency group, no-change runs exit 0
    # Both slots can still be dropped for hours (Nov 19: no events 04:10–13:23 UTC). scout-import.yml
    # dispatches this workflow when the last success is older than 3h (Scout pushes are not GitHub cron).
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: lium-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r mcp_server/requirements.txt pytest pyyaml "jsonschema[format]==4.*"
      - name: Collect, rebuild, test, commit, push (rebase-retry), dispatch deploy
        env:
          GH_TOKEN: ${{ github.token }}
          LANTERN_DEALS_FILE: api/v1/deals.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          S="$GITHUB_STEP_SUMMARY"
          build() {
            python3 scripts/collect_lium.py >> "$S" 2>&1 || { echo "collector refused; current data kept" >> "$S"; git checkout -q -- data/gpu_pricing; return 1; }
            python3 scripts/availability_rate_7d.py >> "$S" 2>&1 || return 3  # T112: 7-day in-stock share from Scout import history
            python3 scripts/sync_today_snapshot.py >> "$S" 2>&1 || return 3
            # Same #220 pin as gpu-refresh.yml: generate + pytest must share one clock.
            # Without it, generate uses wall-clock now_utc() and test_committed_pages_match
            # pins to feed_updated_at (kept when ranked prices are unchanged), so the pin
            # commit (below) leaves pages/API/homepage out of sync and the follow-up
            # validate-and-deploy run fails pytest.
            # gpu_calculator.write() also advances feed_updated_at to this clock whenever
            # published rows change (prices or an availability stale flip). Do not leave
            # the stamp at a newer ranked verified_at that is earlier than this pin:
            # the 2026-11-16 07:15:31Z Lium run flipped Vast A100 stale at ~07:16:26Z
            # but kept 07:15:31Z, and pages-match (pinned to the stamp) disagreed.
            # Fresh clock on every attempt. ${LW_AVAIL_NOW:-date} reused the first attempt's
            # clock after a rejected push, so a later collect's checked_at was in the
            # future vs the pin (2026-11-26 Lium run 45845293580) and baked
            # availability window_stale that deploy restamp (pinned to feed_updated_at)
            # does not reproduce.
            export LW_AVAIL_NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            python3 scripts/generate_seo_pages.py > /dev/null || return 3
            python3 scripts/gpu_index.py . api/v1 > /dev/null || return 3
            python3 scripts/generate_seo_pages.py > /dev/null || return 3
            # validate-and-deploy restamp pins to feed_updated_at, which can be a
            # ranked verified_at later than this job's first clock. Re-pin and
            # regenerate so the committed tree matches that stamp.
            export LW_AVAIL_NOW="$(python3 -c "import json; print(json.load(open('api/v1/gpu-prices.json'))['feed_updated_at'])")"
            python3 scripts/generate_seo_pages.py > /dev/null || return 3
            git diff --quiet -- deals.json api/v1/deals.json || { echo "::warning::deals.json changed; not publishing"; return 3; }
            [ -n "$(git status --porcelain)" ] || return 1
            python3 scripts/validate_feed.py > /dev/null || return 3
            python3 -m pytest -q tests || return 3
          }
          rc=0; build || rc=$?
          [ "$rc" = 0 ] || { [ "$rc" = 1 ] && exit 0; exit 1; }
          for i in 1 2 3 4; do
            git add -A
            git commit -qm "data: Lium collector $(python3 -c 'import json;print(json.load(open("data/gpu_pricing/lium.json"))["checked_at"])')"
            export LW_AVAIL_NOW="$(python3 -c "import json; print(json.load(open('api/v1/gpu-prices.json'))['feed_updated_at'])")"
            python3 scripts/gpu_index.py . api/v1 > /dev/null && python3 scripts/generate_seo_pages.py > /dev/null
            if [ -n "$(git status --porcelain)" ]; then git add -A && git commit -qm "data: pin GPU index to the feed commit"; fi
            # Pin commit is part of what gets pushed; it must pass the same gates as build().
            python3 scripts/validate_feed.py > /dev/null || exit 1
            python3 -m pytest -q tests || exit 1
            if sh scripts/rebase_push_main.sh; then pushed=1; break; fi
            echo "push rejected; resetting to origin/main and re-collecting (attempt $i)"
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            sleep $((i * 15))
            rc=0; build || rc=$?
            [ "$rc" = 0 ] || { [ "$rc" = 1 ] && exit 0; exit 1; }
          done
          [ "${pushed:-0}" = 1 ] || { echo "push failed after retries"; exit 1; }
          sh scripts/dispatch_deploy_after_push.sh "$(git rev-parse HEAD)"
