name: Price history backup

# Sturdiness pass (Relay, 2026-11-17): a daily backup of the price history with a tested restore.
# Destination: a GitHub Actions artifact kept for 90 days, the maximum for a public repo. It is free, needs only
# contents: read (no tag, release, or main write, so "only Mart touches main" holds), prunes itself, and comes back
# with `gh run download <run-id> -n price-history-<run-id>`. D1 exports are optional. They run only when the
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and BACKUP_PASSPHRASE secrets exist, and they are gpg-encrypted
# before upload because artifacts of a public repo can be downloaded by any signed-in GitHub user.
# Wrangler output is discarded because it prints a presigned download URL for the export.
on:
  schedule:
    - cron: "37 6 * * *"   # daily 06:37 UTC (1:37 AM ET), after the overnight data runs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: price-history-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: git fetch --depth=1 origin scout-data:refs/remotes/origin/scout-data || echo "::warning::scout-data not fetched"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: D1 exports (optional, encrypted; skipped when the secrets are not set)
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          mkdir -p "$RUNNER_TEMP/d1" "$RUNNER_TEMP/wr/node_modules/.cache"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice title=D1 backup skipped::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID or BACKUP_PASSPHRASE secret not set; backing up the data files only."
            echo "failed=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A throwaway wrangler project holding only the D1 bindings from the repo's wrangler.toml files.
          python3 - "$RUNNER_TEMP/wr" <<'PY'
          import sys, tomllib, pathlib
          out = pathlib.Path(sys.argv[1]); dbs = []
          for f in ("hosted/wrangler.toml", "collector/wrangler.toml"):
              dbs += tomllib.loads(pathlib.Path(f).read_text()).get("d1_databases", [])
          t = 'name = "lw-backup"\ncompatibility_date = "2025-10-16"\n'
          for i, d in enumerate(dbs):
              t += f'\n[[d1_databases]]\nbinding = "DB{i}"\ndatabase_name = "{d["database_name"]}"\ndatabase_id = "{d["database_id"]}"\n'
          (out / "wrangler.toml").write_text(t); (out / "package.json").write_text("{}")
          (out / "dbs.txt").write_text("\n".join(d["database_name"] for d in dbs) + "\n")
          PY
          failed=0
          while read -r db; do
            [ -n "$db" ] || continue
            if (cd "$RUNNER_TEMP/wr" && npx -y wrangler@4 d1 export "$db" --remote --output "$RUNNER_TEMP/d1/$db.sql" > /dev/null 2>&1) && [ -s "$RUNNER_TEMP/d1/$db.sql" ]; then
              printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "$RUNNER_TEMP/d1/$db.sql.gpg" "$RUNNER_TEMP/d1/$db.sql"
              shred -u "$RUNNER_TEMP/d1/$db.sql"; echo "D1 $db exported and encrypted"
            else
              rm -f "$RUNNER_TEMP/d1/$db.sql"; echo "::warning title=D1 export failed::$db"; failed=1
            fi
          done < "$RUNNER_TEMP/wr/dbs.txt"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Pack the price history (+ encrypted D1 exports) with a sha256 manifest
        run: python3 scripts/backup_price_history.py --out backup --d1-dir "$RUNNER_TEMP/d1"
      - uses: actions/upload-artifact@v5
        with:
          name: price-history-${{ github.run_id }}
          path: backup/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Fail after upload if a D1 export failed (the data-file backup is still kept)
        if: steps.d1.outputs.failed == '1'
        run: exit 1

  restore-test:
    # Restore the backup this run just made (the latest) into a scratch sqlite and check counts and newest snapshot.
    needs: [backup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          name: price-history-${{ github.run_id }}
          path: restored
      - name: Restore test (sha256 per file, snapshot rows, newest snapshot, history series, D1 tables)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -o pipefail
          python3 scripts/restore_price_history.py restored --verify --require-git --expect-commit "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
